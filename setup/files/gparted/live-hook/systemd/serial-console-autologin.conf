[Service]
# See matching comment in tty-autologin-override.conf - $LIVE_USERNAME never resolves
# (live-config here doesn't create /run/live/live-config), so hardcode the account that
# create-gparted-live's --bootappend-live actually configures ("config username=user").
ExecStart=
ExecStart=-/sbin/agetty -L --autologin user -s %I 115200,38400,9600 $TERM
