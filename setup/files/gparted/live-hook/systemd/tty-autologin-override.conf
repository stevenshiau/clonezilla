[Service]
# live-config >= 11.0.5 never creates /run/live/live-config - its 1130-login component
# only preps /etc/pam.d/login for autologin (drops pam_lastlog), it doesn't export the
# configured username anywhere. create-gparted-live hardcodes "config username=user" in
# --bootappend-live, so the account is never actually dynamic here - hardcode it rather
# than sourcing a file that doesn't exist (which silently dropped the username, shifting
# --noclear into its slot).
ExecStart=
ExecStart=-/sbin/agetty --autologin user --noclear %I
